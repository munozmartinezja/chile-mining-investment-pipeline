[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmip"
version = "0.1.0"
description = "Chile Mining Investment Pipeline for Cochilco Annex C"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1,<2",
  "lifelines>=0.30,<1",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "pytest>=8.3,<9",
  "rapidfuzz>=3.10,<4",
  "ruff>=0.7,<1",
  "tableauhyperapi>=0.0.22500,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cmip"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
